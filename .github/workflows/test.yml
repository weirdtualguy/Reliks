name: test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci --no-audit --no-fund
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test
      - name: Contract pins (hash/sha256 consistency, no recompile; silverc is not available on runners)
        run: node tools/verify-contract.js --no-recompile
      - run: node tools/check-deprecated-hashes.js
      - name: RVM conformance (JS + C99 + ASan/UBSan)
        run: |
          node vm/check.js
          mkdir -p .build
          cc -O2 -std=c99 -o .build/rvm3 vm/rvm.c
          node vm/check3.js .build/rvm3
          cc -O2 -std=c99 -fsanitize=address,undefined -fno-omit-frame-pointer -o .build/rvm3_san vm/rvm.c
          node vm/check3.js .build/rvm3_san
          rm -rf .build
