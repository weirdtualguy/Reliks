<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>pixel-cove · editions</title><style>body{background:#0b0b0f;color:#eee;font-family:monospace;padding:16px}
select,button{background:#16161c;color:#eee;border:1px solid #333;border-radius:8px;padding:8px}
canvas{image-rendering:pixelated;border:2px solid #333;border-radius:8px;margin-top:10px}#st{color:#8f8;margin:8px 0}</style></head><body>
<h2>🌸 pixel-cove · generative editions</h2>
<select id="ed"></select><button onclick="go()">render</button>
<div id="st">loading manifest…</div><canvas id="cv" width="512" height="512"></canvas>
<script>
let S,E;
function exec(bc,seed){const M=0xffffffffffffffffn;let s=0n;for(let i=0;i<8;i++)s|=BigInt(seed[i%seed.length])<<(8n*BigInt(i));if(!s)s=0x9e3779b97f4a7c15n;
 const nx=()=>{s=(s+0x9e3779b97f4a7c15n)&M;let z=s;z=((z^(z>>30n))*0xbf58476d1ce4e5b9n)&M;z=((z^(z>>27n))*0x94d049bb133111ebn)&M;return(z^(z>>31n))&M;};
 const ri=(a,b)=>{if(b<a){const t=a;a=b;b=t}return a+Number(nx()%BigInt(b-a+1))};
 let pc=0;const pal=[],g=new Array(256).fill(0),st=[],lo=new Array(16).fill(0),ct=[];
 const vi=()=>{let v=0,sh=0;for(;;){const b=bc[pc++];v|=(b&127)<<sh;if(!(b&128))break;sh+=7}return v};
 const i16=()=>{const v=((bc[pc]|(bc[pc+1]<<8))<<16)>>16;pc+=2;return v};
 const pop=()=>st.pop(),pl=(x,y,c)=>{if(x>=0&&x<16&&y>=0&&y<16)g[y*16+x]=c};
 const ci=(cx,cy,r,c,m)=>{for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++)if(dx*dx+dy*dy<=r*r){pl(cx+dx,cy+dy,c);if(m)pl(15-(cx+dx),cy+dy,c)}};
 let ops=0;while(pc<bc.length){if(++ops>200000)throw 0;const o=bc[pc++];
  if(o===17)break;else if(o===32){const n=vi();for(let i=0;i<n;i++)pal.push([bc[pc++],bc[pc++],bc[pc++]])}
  else if(o===1)st.push(i16());else if(o===2){const b=pop(),a=pop();st.push(ri(a,b))}
  else if(o===3){const k=vi(),o2=[];for(let i=0;i<k;i++)o2.push(i16());st.push(o2[ri(0,k-1)])}
  else if(o===4)st.push(lo[vi()]);else if(o===5)lo[vi()]=pop();else if(o===6)g.fill(pop());
  else if(o===7){const c=pop(),y=pop(),x=pop();pl(x,y,c)}else if(o===8){const c=pop(),r=pop(),y=pop(),x=pop();ci(x,y,r,c,false)}
  else if(o===9){const c=pop(),r=pop(),y=pop(),x=pop();ci(x,y,r,c,true)}
  else if(o===12){const n=pop(),e=i16();if(n<=0)pc=e;else ct.push({start:pc,rem:n})}
  else if(o===13){const e=ct[ct.length-1];e.rem--;if(e.rem>0)pc=e.start;else ct.pop()}}
 return{pal,g}}
function hx(h){return Uint8Array.from(Buffer.from?[]:[]) } // node-only guard unused in browser
const hex2b=h=>{const a=new Uint8Array(h.length/2);for(let i=0;i<a.length;i++)a[i]=parseInt(h.substr(i*2,2),16);return a};
async function go(){const i=+document.getElementById('ed').value,e=E.editions[i-1];
 document.getElementById('st').textContent='verifying program on-chain…';
 const bc=hex2b(S.pcoveHex);
 try{const coin=await(await fetch(`https://kascov.io/data/testnet-10/c/${S.covenantId}.json`)).json();
  let found=false;
  for(const ev of coin.events||[]){const tx=await(await fetch(`https://kascov.io/data/testnet-10/tx/${ev.txid}.json`)).json();
   if(JSON.stringify(tx).includes(S.slotHex.slice(0,200))){found=true;break}}
  document.getElementById('st').innerHTML=(found?'✅ program verified in revealed on-chain bytes · ':'⚠️ not yet revealed · ')+`edition #${e.i} · seed ${e.seed.slice(0,16)}…`;}
 catch(err){document.getElementById('st').textContent='edition '+e.i+' (chain check skipped: '+err.message+')';}
 const {pal,g}=exec(bc,hex2b(e.seed));
 const x2=document.getElementById('cv').getContext('2d');
 for(let y=0;y<16;y++)for(let x=0;x<16;x++){const[r,gg,b]=pal[g[y*16+x]]||[0,0,0];x2.fillStyle=`rgb(${r},${gg},${b})`;x2.fillRect(x*32,y*32,32,32)}}
(async()=>{S=await(await fetch('series.json')).json();E=await(await fetch('editions.json')).json();
 const sel=document.getElementById('ed');E.editions.forEach(e=>{const o=document.createElement('option');o.value=e.i;o.textContent='edition #'+e.i;sel.appendChild(o)});
 document.getElementById('st').textContent='series '+S.covenantId.slice(0,10)+'… ready';go();})();
</script></body></html>
