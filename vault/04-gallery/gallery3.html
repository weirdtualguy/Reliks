<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>pixel-cove · vector editions</title><style>body{background:#0b0b0f;color:#eee;font-family:monospace;padding:14px}
select,button,input{background:#16161c;color:#eee;border:1px solid #333;border-radius:8px;padding:8px}
#st{color:#8f8;margin:8px 0}#box{margin-top:8px}svg{border:2px solid #333;border-radius:10px}</style></head><body>
<h2>🌸 pixel-cove · vector editions</h2>
<select id="ed"></select> frame <input id="fr" type="range" min="0" max="3" value="0" style="width:90px" oninput="render()">
size <input id="wd" type="range" min="240" max="1024" step="8" value="512" style="width:110px" oninput="render()">
<button onclick="exp()">export svg</button>
<div id="st">loading…</div><div id="box"></div><div id="meta" style="color:#888;font-size:12px"></div>
<script>
const $=id=>document.getElementById(id),hex2b=h=>{const a=new Uint8Array(h.length/2);for(let i=0;i<a.length;i++)a[i]=parseInt(h.substr(i*2,2),16);return a};
const C=512,ROT={2:[-1024,0],3:[-512,887],4:[0,1024],6:[512,887],8:[724,724]};
const mix=x=>{let z=(Math.imul(x^61,0x9e37)<<16)^x;z=Math.imul(z^(z>>>15),0x85ebca6b);z=Math.imul(z^(z>>>13),0xc2b2ae35);return(z^(z>>>16))>>>0};
const rotPt=(x,y,c,s)=>{const dx=x-C,dy=y-C;return[C+((dx*c-dy*s)>>10),C+((dx*s+dy*c)>>10)]};
const mirX=p=>{const a=p.a.slice();if(p.op==='rect')a[0]=1023-a[0]-a[2];else if(p.op==='line'){a[0]=1023-a[0];a[2]=1023-a[2]}else if(p.op==='tri'){a[0]=1023-a[0];a[2]=1023-a[2];a[4]=1023-a[4]}else a[0]=1023-a[0];return{op:p.op,a,c:p.c}};
function hsl(h,s,l){h=((h%1024)+1024)%1024;s=Math.min(1024,Math.max(0,s));l=Math.min(1024,Math.max(0,l));
 const q=l<512?(l*(1024+s))>>10:l+s-((l*s)>>10),p=2*l-q;
 const f=t0=>{let t=((t0%1024)+1024)%1024;if(t<171)return p+(((q-p)*((t*6)>>10))>>10);if(t<512)return q;if(t<683)return p+(((q-p)*(((683-t)*6)>>10))>>10);return p};
 return((f(h+341)>>2)<<16)|((f(h)>>2)<<8)|(f(h+683)>>2)}
function exec2(bc,seed,frame){const M=0xffffffffffffffffn;let s=0n;for(let i=0;i<8;i++)s|=BigInt(seed[i%seed.length])<<(8n*BigInt(i));if(!s)s=0x9e3779b97f4a7c15n;
 const nx=()=>{s=(s+0x9e3779b97f4a7c15n)&M;let z=s;z=((z^(z>>30n))*0xbf58476d1ce4e5b9n)&M;z=((z^(z>>27n))*0x94d049bb133111ebn)&M;return(z^(z>>31n))&M};
 const ri=(a,b)=>{if(b<a){const t=a;a=b;b=t}return a+Number(nx()%BigInt(b-a+1))};
 const sw=Number(nx()&0xffffffffn);let pc=0,cur=0xffffff,bg=0,ops=0;
 const pal=[],st=[],lo=new Array(16).fill(0),ctl=[],mk=[],pr=[];
 const vi=()=>{let v=0,sh=0;for(;;){const b=bc[pc++];v|=(b&127)<<sh;if(!(b&128))break;sh+=7}return v};
 const i16=()=>{const v=((bc[pc]|(bc[pc+1]<<8))<<16)>>16;pc+=2;return v};
 const pop=()=>st.pop(),P=(op,a)=>pr.push({op,a,c:cur});
 while(pc<bc.length){if(++ops>400000)throw 0;const o=bc[pc++];
  if(o===15)break;else if(o===1)st.push(i16());else if(o===2){const b=pop(),a=pop();st.push(ri(a,b))}
  else if(o===3){const k=vi(),ar=[];for(let i=0;i<k;i++)ar.push(i16());st.push(ar[ri(0,k-1)])}
  else if(o===4)st.push(lo[vi()]);else if(o===5)lo[vi()]=pop();
  else if(o===6){const y=pop(),x=pop();st.push(mix(sw^Math.imul(x,73856093)^Math.imul(y,19349663)^Math.imul(frame+1,83492791))&1023)}
  else if(o===7)st.push(frame);
  else if(o===16)cur=pal[pop()]||0;else if(o===17){const b=pop(),g=pop(),r=pop();cur=(r<<16)|(g<<8)|b}
  else if(o===18){const l=pop(),ss=pop(),hh=pop();cur=hsl(hh,ss,l)}
  else if(o===32){const n=vi();for(let i=0;i<n;i++)pal.push((bc[pc++]<<16)|(bc[pc++]<<8)|bc[pc++])}
  else if(o===33)bg=cur;else if(o===34){const r=pop(),y=pop(),x=pop();P('dot',[x,y,r])}
  else if(o===35){const r=pop(),y=pop(),x=pop();P('circle',[x,y,r])}else if(o===36){const r=pop(),y=pop(),x=pop();P('ring',[x,y,r])}
  else if(o===37){const w=pop(),y1=pop(),x1=pop(),y0=pop(),x0=pop();P('line',[x0,y0,x1,y1,w])}
  else if(o===38){const hh=pop(),w=pop(),y=pop(),x=pop();P('rect',[x,y,w,hh])}
  else if(o===39){const y2=pop(),x2=pop(),y1=pop(),x1=pop(),y0=pop(),x0=pop();P('tri',[x0,y0,x1,y1,x2,y2])}
  else if(o===40)mk.push({k:0,n:0,at:pr.length});else if(o===42)mk.push({k:1,n:pop(),at:pr.length});
  else if(o===41){const m=mk.pop(),add=pr.slice(m.at);
   if(m.k===0)add.forEach(p=>pr.push(mirX(p)));
   else{const bs=ROT[m.n];if(!bs)throw 0;for(let k=1;k<m.n;k++){let c=1024,ss=0;for(let i=0;i<k;i++){const nc=((c*bs[0]-ss*bs[1])>>10),ns=((c*bs[1]+ss*bs[0])>>10);c=nc;ss=ns}
    add.forEach(p=>{const q=p.a.slice(),R=i=>{const t2=rotPt(q[i],q[i+1],c,ss);q[i]=t2[0];q[i+1]=t2[1]};
     if(p.op==='line'){R(0);R(2)}else if(p.op==='tri'){R(0);R(2);R(4)}else R(0);pr.push({op:p.op,c:p.c,a:q})})}}}
  else if(o===64){const n=pop(),e=i16();if(n<=0)pc=e;else ctl.push({start:pc,rem:n})}
  else if(o===65){const e=ctl[ctl.length-1];e.rem--;if(e.rem>0)pc=e.start;else ctl.pop()}
  else if(o===66){const j=i16();if(!pop())pc=j}else if(o===67)pc=i16();
  else if(o===80){const b=pop();st.push(pop()+b)}else if(o===81){const b=pop();st.push(pop()-b)}
  else if(o===82){const b=pop();st.push(pop()*b)}else if(o===83){const b=pop();st.push(Math.trunc(pop()/b)}
  else if(o===84){const b=pop();st.push(pop()%b)}else if(o===85){const b=pop();st.push(pop()>>b)}
  else if(o===86){const b=pop();st.push(pop()>b?1:0)}else if(o===87){const b=pop();st.push(pop()<b?1:0)}
  else if(o===88){const b=pop();st.push(pop()===b?1:0)}else throw 0}
 return{bg,prims:pr,ops}}
function toSVG(dl,px){const h=c=>'#'+c.toString(16).padStart(6,'0');
 let s=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="${px}" height="${px}"><rect width="1024" height="1024" fill="${h(dl.bg)}"/>`;
 for(const p of dl.prims){const c=h(p.c),a=p.a;
  if(p.op==='dot'||p.op==='circle')s+=`<circle cx="${a[0]}" cy="${a[1]}" r="${a[2]}" fill="${c}"/>`;
  else if(p.op==='ring')s+=`<circle cx="${a[0]}" cy="${a[1]}" r="${a[2]}" fill="none" stroke="${c}" stroke-width="14"/>`;
  else if(p.op==='line')s+=`<line x1="${a[0]}" y1="${a[1]}" x2="${a[2]}" y2="${a[3]}" stroke="${c}" stroke-width="${a[4]}" stroke-linecap="round"/>`;
  else if(p.op==='rect')s+=`<rect x="${a[0]}" y="${a[1]}" width="${a[2]}" height="${a[3]}" fill="${c}"/>`;
  else s+=`<polygon points="${a[0]},${a[1]} ${a[2]},${a[3]} ${a[4]},${a[5]}" fill="${c}"/>`}
 return s+'</svg>'}
let F2,ED,PCOVE;
function render(){if(!PCOVE)return;const e=ED.editions[+$('ed').value],dl=exec2(hex2b(PCOVE),hex2b(e.seed),+$('fr').value);
 $('box').innerHTML=toSVG(dl,+$('wd').value);$('meta').textContent=`edition #${e.i} · frame ${$('fr').value} · ${dl.prims.length} prims · ${dl.ops} ops · seed ${e.seed.slice(0,16)}…`}
function exp(){const b=new Blob([$('box').innerHTML],{type:'image/svg+xml'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`pixel-cove-ed${$('ed').value}-f${$('fr').value}.svg`;a.click()}
(async()=>{F2=await(await fetch('factory2.json')).json();ED=await(await fetch('editions2.json')).json();
 const PROG=(await(await fetch('factory2-program.hex')).text()).trim();
 const mk=F2.slotHex.slice(0,2),len=parseInt(F2.slotHex.slice(2,6),16);
 PCOVE=F2.slotHex.slice(6,6+len*2);
 ED.editions.forEach(e=>{const o=document.createElement('option');o.value=e.i;o.textContent='edition #'+e.i;$('ed').appendChild(o)});
 $('ed').onchange=render;
 try{const coin=await(await fetch(`https://kascov.io/data/testnet-10/c/${F2.covenantId}.json`)).json();
  const mt=coin.events.find(e=>e.kind==='transition');
  const tx=await(await fetch(`https://kascov.io/data/testnet-10/tx/${mt.txid}.json`)).json();
  $('st').textContent=(JSON.stringify(tx).includes(PROG)?'✅ program verified in mint witness · ':'⚠️ witness check failed · ')+`marker 0x${mk} · ${len}B vector program · ${coin.events.map(e=>e.kind).join(' → ')}`;}
 catch(e){$('st').textContent='chain check skipped: '+e.message}
 render();})();
</script></body></html>
