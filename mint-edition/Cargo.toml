[package]
name = "mint-edition"
version = "0.1.0"
edition = "2021"

[dependencies]
kaspa-consensus-core = "0.15"
kaspa-grpc-client = "0.15"
kaspa-wrpc-client = "0.15"
kaspa-rpc-core = "0.15"
kaspa-hashes = "0.15"
kaspa-txscript = "0.15"
kaspa-txscript-errors = "0.15"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
blake2 = "0.10"
secp256k1 = { version = "0.28", features = ["rand", "global-context"] }
rand = "0.8"
reqwest = { version = "0.11", features = ["json"] }
